<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4267145705389931"
     crossorigin="anonymous"></script>
  <title>【16桁専門】爆速パスワード作成ツール</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 { font-size: 1.25rem; color: #333; margin-bottom: 0.5rem; }
    p { font-size: 0.85rem; color: #666; margin-bottom: 1.5rem; }
    .password-box {
      font-family: monospace;
      font-size: 1.3rem;
      font-weight: bold;
      background: #eef2f5;
      padding: 1rem;
      border-radius: 8px;
      word-break: break-all;
      letter-spacing: 2px;
      color: #1a202c;
      margin-bottom: 1.5rem;
      border: 2px solid #cbd5e1;
    }
    .btn {
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 0.8rem;
      transition: background 0.2s;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover { background: #cbd5e1; }
    .footer-note { font-size: 0.75rem; color: #94a3b8; margin-top: 1.5rem; }
  </style>
</head>
<body>

  <div class="card">
    <h1>16桁強固パスワード</h1>
    <p>英大・小文字＋数字＋記号が最初からフルセット！</p>
    
    <div id="password" class="password-box">生成中...</div>

    <button class="btn btn-primary" onclick="copyPassword()">クリップボードにコピー</button>
    <button class="btn btn-secondary" onclick="generatePassword()">別のをつくる（再生成）</button>

    <div class="footer-note">※通信なし。お使いの端末内で安全に生成されています。</div>
  </div>

  <script>
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?";

    function generatePassword() {
      let password = "";
      // 暗号学的に安全な乱数（Crypto API）を使用
      const array = new Uint32Array(16);
      window.crypto.getRandomValues(array);
      for (let i = 0; i < 16; i++) {
        password += chars[array[i] % chars.length];
      }
      document.getElementById("password").innerText = password;
    }

    function copyPassword() {
      const passText = document.getElementById("password").innerText;
      navigator.clipboard.writeText(passText).then(() => {
        alert("コピーしました！");
      });
    }

    // ページが開いた瞬間に生成実行！
    window.onload = generatePassword;
  </script>

</body>
</html>
